<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sala de estudio — reloj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1614; --panel:#112420; --panel-up:#17302A; --line:#20403A;
    --trabajo:#4FB08A; --trabajo-tenue:#2B6B54;
    --descanso:#E2A93E; --descanso-tenue:#8A6A26;
    --rojo:#E2716B;
    --texto:#EBF4EF; --tenue:#84A498; --tenue2:#5D7A70;
    --mono: ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
    --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    --disp: "Space Grotesk", var(--sans);
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--texto);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;padding:20px 16px 40px;
  }
  .wrap{max-width:760px;margin:0 auto}
  .eyebrow{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--tenue);margin-bottom:8px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;
    animation:entrar .5s cubic-bezier(.16,1,.3,1) both;}
  @keyframes entrar{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .sala{font-family:var(--disp);font-weight:700;font-size:28px;letter-spacing:6px;line-height:1}
  button{
    font-family:var(--sans);font-size:14px;font-weight:500;color:var(--texto);
    background:transparent;border:1px solid var(--line);border-radius:9px;
    padding:10px 16px;cursor:pointer;transition:background .12s ease,border-color .12s ease,transform .08s ease;
  }
  button:hover{background:var(--panel-up)}
  button:active{transform:scale(.97)}
  button.fuerte{background:var(--trabajo);border-color:var(--trabajo);color:#06211A;font-weight:700}
  button.fuerte.descanso{background:var(--descanso);border-color:var(--descanso);color:#2B1E02}
  button.tenue{border-color:transparent;color:var(--tenue)}
  button.chico{font-size:12px;padding:6px 12px}
  button:disabled{opacity:.35;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--trabajo);outline-offset:2px}
  input[type="text"],input[type="number"]{
    background:var(--panel-up);border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;color:var(--texto);font-family:var(--sans);font-size:15px;outline:none;
  }
  input:focus{border-color:var(--trabajo)}

  /* ---- anillo ---- */
  .escenario{display:flex;flex-direction:column;align-items:center;padding:10px 0 4px}
  .anillo-caja{position:relative;width:min(72vw,300px);height:min(72vw,300px)}
  .anillo-caja.pulso{animation:respirar 2.6s ease-in-out infinite}
  @keyframes respirar{
    0%,100%{filter:drop-shadow(0 0 0px transparent)}
    50%{filter:drop-shadow(0 0 22px var(--glow, rgba(79,176,138,.35)))}
  }
  .anillo-caja.flash{animation:destello .9s ease-out}
  @keyframes destello{
    0%{transform:scale(1)}
    30%{transform:scale(1.045)}
    100%{transform:scale(1)}
  }
  svg.anillo{width:100%;height:100%;transform:rotate(-90deg)}
  .pista{fill:none;stroke:var(--line);stroke-width:9}
  .progreso{fill:none;stroke:var(--trabajo);stroke-width:9;stroke-linecap:round;
    transition:stroke-dashoffset .25s linear, stroke .3s ease}
  .progreso.descanso{stroke:var(--descanso)}
  .centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .fase{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--trabajo);
    transition:color .3s ease}
  .fase.descanso{color:var(--descanso)}
  .digitos{font-family:var(--mono);font-size:clamp(46px,11vw,64px);font-variant-numeric:tabular-nums;line-height:1}
  .subestado{font-size:12.5px;color:var(--tenue);text-align:center;min-height:16px;max-width:220px}

  .controles-fila{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
  .ajustes{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
  .campo-mini{display:flex;flex-direction:column;gap:5px;align-items:center}
  .campo-mini label{font-size:11px;color:var(--tenue2);letter-spacing:.4px}
  .campo-mini .caja{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:2px 4px 2px 10px}
  .campo-mini input{width:44px;background:transparent;border:none;padding:6px 2px;font-family:var(--mono);font-size:14px}
  .toggle-loop{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tenue);cursor:pointer;user-select:none}
  .toggle-loop input{accent-color:var(--trabajo);width:16px;height:16px}

  /* ---- personas ---- */
  .persona{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);
    animation:entrar .35s ease both}
  .persona:first-of-type{border-top:none}
  .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-weight:700;font-size:13px;color:#08201A;flex:none}
  .persona .info{flex:1;min-width:0}
  .persona .n{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .persona .n.yo::after{content:" · tú";color:var(--trabajo);font-weight:600}
  .persona .d{font-family:var(--mono);font-size:12px;color:var(--tenue)}

  /* ---- feed ---- */
  .feed{display:flex;flex-direction:column;gap:2px;max-height:170px;overflow-y:auto}
  .feed-item{font-size:12.5px;color:var(--tenue2);padding:5px 0;border-top:1px solid var(--line);
    animation:entrarFeed .3s ease both;display:flex;gap:6px}
  .feed-item:first-child{border-top:none}
  @keyframes entrarFeed{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
  .feed-item b{color:var(--tenue);font-weight:600}
  .feed-vacio{font-size:13px;color:var(--tenue2)}

  .pie{font-size:12px;color:var(--tenue2);margin-top:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .aviso{margin-top:12px;font-size:13px;color:var(--descanso);line-height:1.5}
  .oculto{display:none !important}
  .fila{display:flex;gap:8px}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important} }
</style>
</head>
<body>
<div class="wrap">

  <!-- entrada de nombre -->
  <div class="panel" id="panelEntrada">
    <div class="eyebrow">Antes de entrar</div>
    <h1 style="font-family:var(--disp);font-weight:700;font-size:21px;margin:0 0 8px">¿Cómo te llamas?</h1>
    <p style="font-size:14px;color:var(--tenue);line-height:1.5;margin:0 0 16px">
      Tu nombre aparece con tus bloques de estudio para todos en la sala.
    </p>
    <div class="fila">
      <input type="text" id="campoNombre" placeholder="Aris" maxlength="18" style="flex:1" />
      <button class="fuerte" id="btnUnirse">Entrar a la sala</button>
    </div>
  </div>

  <div id="app" class="oculto">
    <div class="head">
      <div>
        <div class="eyebrow">Sala</div>
        <div class="sala" id="tituloSala">—</div>
      </div>
      <div class="fila" style="flex-wrap:wrap">
        <button class="chico" id="btnLink">Copiar link</button>
        <button class="chico" id="btnSonido">Activar sonido</button>
      </div>
    </div>

    <div class="panel" id="panelReloj">
      <div class="escenario">
        <div class="anillo-caja" id="anilloCaja">
          <svg class="anillo" viewBox="0 0 220 220">
            <circle class="pista" cx="110" cy="110" r="98"></circle>
            <circle class="progreso" id="circProgreso" cx="110" cy="110" r="98"></circle>
          </svg>
          <div class="centro">
            <div class="fase" id="etiquetaFase">LISTO</div>
            <div class="digitos" id="digitos">50:00</div>
            <div class="subestado" id="subestado">Configura tus bloques y arranca</div>
          </div>
        </div>
      </div>

      <div class="controles-fila" id="filaAccion">
        <button class="fuerte" id="btnIniciar">Iniciar</button>
      </div>

      <div class="controles-fila oculto" id="filaEnCurso">
        <button id="btnPausar">Pausar</button>
        <button class="fuerte oculto" id="btnReanudar">Reanudar</button>
        <button class="tenue" id="btnSaltar">Saltar a siguiente</button>
        <button class="tenue" id="btnDetener">Detener sesión</button>
      </div>

      <div class="ajustes" id="panelAjustes">
        <div class="campo-mini">
          <label>Trabajo (min)</label>
          <div class="caja"><input type="number" id="minTrabajo" min="1" max="240" value="50" /></div>
        </div>
        <div class="campo-mini">
          <label>Descanso (min)</label>
          <div class="caja"><input type="number" id="minDescanso" min="1" max="60" value="10" /></div>
        </div>
        <label class="toggle-loop">
          <input type="checkbox" id="autoLoop" checked />
          Repetir en loop
        </label>
      </div>
    </div>

    <div class="panel" style="margin-top:14px">
      <div class="eyebrow">En la sala (<span id="conteoGente">0</span>)</div>
      <div id="listaGente"></div>
    </div>

    <div class="panel" style="margin-top:14px">
      <div class="eyebrow">Actividad</div>
      <div class="feed" id="feed"><div class="feed-vacio">Sin actividad todavía.</div></div>
    </div>

    <div class="pie">
      <span id="pieIzq">—</span>
      <span id="pieDer">Sonido apagado</span>
    </div>
    <div class="aviso oculto" id="aviso"></div>
  </div>
</div>

<script type="module">
/* ========= CONFIGURACIÓN FIREBASE ========= */
const FIREBASE = {
  apiKey: "AIzaSyCurBiYUGckz1cpRmpTLWu_ketz12oIOoQ",
  databaseURL: "https://reloj-enarm-default-rtdb.firebaseio.com",
  projectId: "reloj-enarm"
};

/* ========= utilidades ========= */
const $ = (id) => document.getElementById(id);
const dosDig = (n) => String(n).padStart(2, "0");
const formato = (ms) => {
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return h > 0 ? `${h}:${dosDig(m)}:${dosDig(s)}` : `${dosDig(m)}:${dosDig(s)}`;
};
const codigoNuevo = () => {
  const L = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  return Array.from({length:4}, () => L[Math.floor(Math.random()*L.length)]).join("");
};
const idNuevo = () => Math.random().toString(36).slice(2, 10);
const restante = (t, ahora) => !t ? 0 : (t.corriendo ? t.duracionMs - (ahora - t.iniciadoEn) : t.pausadoEn);
const escapar = (s) => String(s).replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));

const PALETA = ["#4FB08A","#E2A93E","#C77DFF","#4FA5D1","#E2716B","#8FBF6B"];
function colorDeNombre(nombre){
  let h = 0;
  for (const c of String(nombre)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return PALETA[h % PALETA.length];
}
function iniciales(nombre){
  return String(nombre).trim().split(/\s+/).slice(0,2).map(p => p[0] || "").join("").toUpperCase() || "?";
}

/* ========= campana ========= */
let ctxAudio = null, sonidoOn = false;
async function activarSonido(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    ctxAudio = ctxAudio || new AC();
    if(ctxAudio.state === "suspended") await ctxAudio.resume();
    return ctxAudio.state === "running";
  }catch{ return false; }
}
function tocarTono(freqs, vol, t0, dur){
  freqs.forEach((f) => {
    const osc = ctxAudio.createOscillator(), g = ctxAudio.createGain();
    osc.type = "sine"; osc.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(ctxAudio.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  });
}
function campanaFinTrabajo(){
  if(!ctxAudio) return;
  const t0 = ctxAudio.currentTime;
  [0, 0.7, 1.4].forEach((d,i) => tocarTono([880,1320], i===0?0.35:0.2, t0+d, 1.0));
}
function campanaFinDescanso(){
  if(!ctxAudio) return;
  const t0 = ctxAudio.currentTime;
  [0, 0.55].forEach((d) => tocarTono([660,990], 0.28, t0+d, 0.9));
}

/* ========= estado ========= */
const params = new URLSearchParams(location.search);
const enVivo = !!FIREBASE.databaseURL;
const sala = (params.get("sala") || "").toUpperCase() || codigoNuevo();
const miId = idNuevo();
let miNombre = localStorage.getItem("nombre-sala") || "";
let miColor = "#4FB08A";
let timer = null;
let backend = null;
let procesadoClave = null; // evita doble-crédito local en la misma persona

/* ========= backend en vivo (Firebase) ========= */
async function crearBackendFirebase(){
  const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const dbMod  = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  const app = appMod.initializeApp(FIREBASE);
  const db  = dbMod.getDatabase(app);
  const refTimer  = dbMod.ref(db, `salas/${sala}/timer`);
  const refGente  = dbMod.ref(db, `salas/${sala}/gente`);
  const refYo     = dbMod.ref(db, `salas/${sala}/gente/${miId}`);
  const refEventos = dbMod.ref(db, `salas/${sala}/eventos`);

  dbMod.onDisconnect(refYo).remove();

  return {
    dbMod, db, refTimer, refGente, refYo, refEventos,
    escuchar(cbTimer, cbGente, cbEventos){
      dbMod.onValue(refTimer, (snap) => cbTimer(snap.val()));
      dbMod.onValue(refGente, (snap) => cbGente(Object.entries(snap.val() || {})));
      const qEventos = dbMod.query(refEventos, dbMod.limitToLast(8));
      dbMod.onValue(qEventos, (snap) => {
        const arr = Object.values(snap.val() || {}).sort((a,b) => b.ts - a.ts);
        cbEventos(arr);
      });
    },
    guardarTimer(t){ dbMod.set(refTimer, t); },
    latido(datos){ dbMod.update(refYo, datos); },
    evento(tipo, extra){ dbMod.push(refEventos, { tipo, nombre: miNombre, ts: Date.now(), ...extra }); }
  };
}

/* ========= backend simple (sin Firebase, respaldo) ========= */
function crearBackendLocal(){
  return {
    escuchar(cbTimer){
      const leer = () => {
        const h = new URLSearchParams(location.hash.slice(1));
        const ini = Number(h.get("i")), dur = Number(h.get("d"));
        if(ini && dur) cbTimer({ fase:"trabajo", duracionMs:dur, iniciadoEn:ini, pausadoEn:dur, corriendo:true,
          por:h.get("p")||"", minTrabajoMin:Math.round(dur/60000), minDescansoMin:10, autoLoop:false });
      };
      leer();
      window.addEventListener("hashchange", leer);
    },
    guardarTimer(t){
      timer = t;
      if(t && t.corriendo){
        const h = new URLSearchParams({ i:String(t.iniciadoEn), d:String(t.duracionMs), p:miNombre||"" });
        history.replaceState(null, "", location.pathname + location.search + "#" + h.toString());
      }
      pintarTodo();
    },
    latido(){}, evento(){}
  };
}

/* ========= render ========= */
const circ = $("circProgreso");
const RADIO = 98, PERIM = 2 * Math.PI * RADIO;
circ.style.strokeDasharray = `${PERIM}`;

function pintarTodo(){
  const ahora = Date.now();
  const enDescanso = timer && timer.fase === "descanso";
  const r = timer ? Math.max(0, restante(timer, ahora)) : (Number($("minTrabajo").value)||50)*60000;
  const total = timer ? timer.duracionMs : (Number($("minTrabajo").value)||50)*60000;
  const avance = total > 0 ? Math.min(1, Math.max(0, 1 - r/total)) : 0;

  circ.style.strokeDashoffset = String(PERIM * (1 - avance));
  circ.classList.toggle("descanso", !!enDescanso);
  $("etiquetaFase").classList.toggle("descanso", !!enDescanso);
  $("etiquetaFase").textContent = !timer ? "LISTO" : (enDescanso ? "DESCANSO" : "TRABAJO");
  $("digitos").textContent = formato(r);

  const corriendo = timer && timer.corriendo && r > 0;
  $("anilloCaja").style.setProperty("--glow", enDescanso ? "rgba(226,169,62,.38)" : "rgba(79,176,138,.35)");
  $("anilloCaja").classList.toggle("pulso", !!corriendo);

  $("subestado").textContent = !timer
    ? "Configura tus bloques y arranca"
    : r > 0
      ? (timer.corriendo
          ? `${enDescanso ? "Descansando" : "Bloque de estudio"} · ${Math.round(timer.duracionMs/60000)} min${timer.por && timer.por!=="auto" ? " · inició "+timer.por : ""}`
          : "En pausa")
      : "Cambiando de bloque…";

  $("filaAccion").classList.toggle("oculto", !!timer);
  $("filaEnCurso").classList.toggle("oculto", !timer);
  $("panelAjustes").classList.toggle("oculto", !!timer);
  $("btnPausar").classList.toggle("oculto", !(timer && timer.corriendo));
  $("btnReanudar").classList.toggle("oculto", !(timer && !timer.corriendo));
  $("btnSaltar").classList.toggle("oculto", !timer);

  procesarTransicion(ahora);
}

function pintarGente(entradas){
  const lista = entradas.map(([id,p]) => ({ id, ...p }))
    .sort((a,b) => (b.bloques||0) - (a.bloques||0));
  $("conteoGente").textContent = lista.length;
  $("listaGente").innerHTML = lista.length ? lista.map(p => `
    <div class="persona">
      <div class="avatar" style="background:${colorDeNombre(p.nombre)}">${iniciales(p.nombre)}</div>
      <div class="info">
        <div class="n ${p.id===miId?"yo":""}">${escapar(p.nombre||"Sin nombre")}</div>
      </div>
      <div class="d">${p.bloques||0} bloques · ${p.minutos||0} min</div>
    </div>`).join("") : `<div class="feed-vacio">Todavía nadie más aquí.</div>`;
}

const ETIQUETAS_EVENTO = {
  union: (n) => `<b>${escapar(n)}</b> se unió a la sala`,
  inicio: (n,e) => `<b>${escapar(n)}</b> inició un bloque de ${e.min||""} min`,
  bloque_ok: (n,e) => `<b>${escapar(n)}</b> completó un bloque de ${e.min||""} min`,
  descanso_ok: (n) => `<b>${escapar(n)}</b> terminó su descanso`,
  detenido: (n) => `<b>${escapar(n)}</b> detuvo la sesión`,
};
function pintarFeed(eventos){
  if(!eventos.length){ $("feed").innerHTML = `<div class="feed-vacio">Sin actividad todavía.</div>`; return; }
  $("feed").innerHTML = eventos.slice(0,6).map(e => {
    const f = ETIQUETAS_EVENTO[e.tipo];
    return `<div class="feed-item">${f ? f(e.nombre, e) : escapar(e.tipo)}</div>`;
  }).join("");
}

/* ========= transición automática ========= */
function procesarTransicion(ahora){
  if(!timer || !timer.corriendo) return;
  const r = restante(timer, ahora);
  if(r > 0) return;
  const clave = `${timer.fase}:${timer.iniciadoEn}`;
  if(procesadoClave === clave) return;
  procesadoClave = clave;

  const minT = timer.minTrabajoMin || 50, minD = timer.minDescansoMin || 10;
  const eraTrabajo = timer.fase !== "descanso";

  if(sonidoOn){ eraTrabajo ? campanaFinTrabajo() : campanaFinDescanso(); }
  document.getElementById("anilloCaja").classList.remove("flash");
  void document.getElementById("anilloCaja").offsetWidth;
  document.getElementById("anilloCaja").classList.add("flash");

  // crédito personal — solo si mi pestaña estaba abierta para notarlo
  if(eraTrabajo){
    backend.latido({ bloques: (misGenteLocal.bloques||0)+1, minutos: (misGenteLocal.minutos||0)+minT, nombre: miNombre });
    misGenteLocal.bloques = (misGenteLocal.bloques||0)+1;
    misGenteLocal.minutos = (misGenteLocal.minutos||0)+minT;
    backend.evento("bloque_ok", { min: minT });
  } else {
    backend.evento("descanso_ok", {});
  }

  if(!timer.autoLoop){
    backend.guardarTimer({ ...timer, corriendo:false, pausadoEn:0 });
    return;
  }
  const siguienteFase = eraTrabajo ? "descanso" : "trabajo";
  const dur = (siguienteFase === "descanso" ? minD : minT) * 60000;
  backend.guardarTimer({
    fase: siguienteFase, duracionMs: dur, iniciadoEn: Date.now(), pausadoEn: dur,
    corriendo: true, por: "auto", minTrabajoMin: minT, minDescansoMin: minD, autoLoop: true
  });
  if(siguienteFase === "trabajo") backend.evento("inicio", { min: minT });
}

/* ========= acciones ========= */
let misGenteLocal = { bloques:0, minutos:0 };

function iniciar(){
  const minT = Math.max(1, Number($("minTrabajo").value) || 50);
  const minD = Math.max(1, Number($("minDescanso").value) || 10);
  const loop = $("autoLoop").checked;
  procesadoClave = null;
  backend.guardarTimer({
    fase: "trabajo", duracionMs: minT*60000, iniciadoEn: Date.now(), pausadoEn: minT*60000,
    corriendo: true, por: miNombre, minTrabajoMin: minT, minDescansoMin: minD, autoLoop: loop
  });
  backend.evento("inicio", { min: minT });
  if(!enVivo) mostrarAviso("Copia el link y pásalo — quien lo abra ve este mismo bloque.");
}
function pausar(){
  if(!timer || !timer.corriendo) return;
  backend.guardarTimer({ ...timer, corriendo:false, pausadoEn: Math.max(0, restante(timer, Date.now())) });
}
function reanudar(){
  if(!timer || timer.corriendo) return;
  backend.guardarTimer({ ...timer, corriendo:true, iniciadoEn: Date.now() - (timer.duracionMs - timer.pausadoEn) });
}
function saltar(){
  if(!timer) return;
  const minT = timer.minTrabajoMin || 50, minD = timer.minDescansoMin || 10;
  const sig = timer.fase === "descanso" ? "trabajo" : "descanso";
  const dur = (sig === "descanso" ? minD : minT) * 60000;
  procesadoClave = null;
  backend.guardarTimer({ ...timer, fase: sig, duracionMs: dur, iniciadoEn: Date.now(), pausadoEn: dur, corriendo:true, por: miNombre });
}
function detener(){
  if(!timer) return;
  backend.guardarTimer(null);
  backend.evento("detenido", {});
  mostrarAviso("Sesión detenida. Ajusta tus tiempos y arranca cuando quieras.");
}
function mostrarAviso(txt){
  $("aviso").textContent = txt;
  $("aviso").classList.remove("oculto");
  clearTimeout(mostrarAviso._t);
  mostrarAviso._t = setTimeout(() => $("aviso").classList.add("oculto"), 6000);
}

/* ========= arranque ========= */
async function entrarSala(){
  $("panelEntrada").classList.add("oculto");
  $("app").classList.remove("oculto");
  miColor = colorDeNombre(miNombre);
  $("tituloSala").textContent = enVivo ? sala : "Bloque";
  $("pieIzq").textContent = enVivo ? "Sala en vivo · loop automático activo" : "Modo link · sin descansos automáticos entre pestañas";

  if(enVivo){
    if(!params.get("sala")) history.replaceState(null, "", `?sala=${sala}`);
    try{
      backend = await crearBackendFirebase();
      backend.escuchar(
        (t) => { timer = t; pintarTodo(); },
        (entradas) => pintarGente(entradas),
        (eventos) => pintarFeed(eventos)
      );
      backend.latido({ nombre: miNombre, bloques:0, minutos:0 });
      const yaAnuncio = sessionStorage.getItem(`union-${sala}`);
      if(!yaAnuncio){ backend.evento("union", {}); sessionStorage.setItem(`union-${sala}`, "1"); }
      setInterval(() => backend.latido({ nombre: miNombre }), 25000);
    }catch(e){
      backend = crearBackendLocal();
      backend.escuchar((t) => { timer = t; pintarTodo(); });
      mostrarAviso("No se pudo conectar a la sala en vivo. Funcionando en modo link.");
    }
  }else{
    backend = crearBackendLocal();
    backend.escuchar((t) => { timer = t; pintarTodo(); });
  }

  setInterval(pintarTodo, 250);
  pintarTodo();
}

$("campoNombre").value = miNombre;
$("btnUnirse").addEventListener("click", () => {
  const n = $("campoNombre").value.trim().slice(0,18);
  if(!n) return;
  miNombre = n;
  localStorage.setItem("nombre-sala", n);
  entrarSala();
});
$("campoNombre").addEventListener("keydown", (e) => { if(e.key === "Enter") $("btnUnirse").click(); });

$("btnLink").addEventListener("click", async () => {
  try{ await navigator.clipboard.writeText(location.href); mostrarAviso("Link copiado. Pásalo al grupo."); }
  catch{ mostrarAviso("Copia la dirección de la barra del navegador."); }
});
$("btnSonido").addEventListener("click", async () => {
  sonidoOn = await activarSonido();
  $("btnSonido").textContent = sonidoOn ? "Probar campana" : "Activar sonido";
  $("pieDer").textContent = sonidoOn ? "Campana activa en este dispositivo" : "Sonido bloqueado por el navegador";
  if(sonidoOn) campanaFinDescanso();
});
$("btnIniciar").addEventListener("click", iniciar);
$("btnPausar").addEventListener("click", pausar);
$("btnReanudar").addEventListener("click", reanudar);
$("btnSaltar").addEventListener("click", saltar);
$("btnDetener").addEventListener("click", detener);

if(miNombre) entrarSala();
</script>
