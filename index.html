<body>
<div id="root"></div>
<script type="module">

/* ========= CONFIGURACIÓN FIREBASE (reloj-enarm) ========= */
const FIREBASE = {
  apiKey: "AIzaSyCurBiYUGckz1cpRmpTLWu_ketz12oIOoQ",
  databaseURL: "https://reloj-enarm-default-rtdb.firebaseio.com",
  projectId: "reloj-enarm"
};

const root = document.getElementById("root");
const esc = (s) => String(s ?? "").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const params = new URLSearchParams(location.search);
const idNuevo = () => Math.random().toString(36).slice(2, 10);
const hoyISO = () => new Date().toISOString().slice(0, 10);
function fmt(s) { s = Math.floor(Math.max(0, s)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }

/* ========= frases motivacionales — rotan automáticamente cada día ========= */
const FRASES = [
  "Cada bloque de estudio te acerca a tu especialidad.",
  "La constancia le gana al talento.",
  "Hoy estudias lo que mañana salvará una vida.",
  "Un día a la vez, una pregunta a la vez.",
  "Tu yo del futuro te va a agradecer este esfuerzo.",
  "No tiene que ser perfecto, tiene que ser constante.",
  "La disciplina es el puente entre tus metas y tus logros.",
  "Pequeños avances diarios crean resultados enormes.",
  "El ENARM no se gana en un día, se gana todos los días.",
  "Descansar también es parte de estudiar.",
  "Enfócate en el proceso, el resultado llegará.",
  "Cada repaso cuenta, aunque no lo sientas.",
  "Estudia con intención, descansa sin culpa.",
  "Eres más capaz de lo que crees.",
  "La mejor inversión es la que haces en ti.",
  "Un poco más cada día: así se construyen los sueños.",
  "Confía en tu preparación.",
  "Lo difícil de hoy será tu anécdota de mañana.",
  "No cuentes los días, haz que los días cuenten.",
  "Tu esfuerzo silencioso hará mucho ruido en los resultados.",
  "Nadie dijo que sería fácil, pero valdrá la pena.",
  "El éxito es la suma de pequeños esfuerzos repetidos.",
  "Hoy también es un buen día para avanzar.",
  "Respira, enfócate y continúa.",
];
function fraseDelDia() {
  const d = new Date();
  const dia = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
  return FRASES[dia % FRASES.length];
}

/* ========= fecha y cuenta regresiva al ENARM ========= */
const ENARM_FECHA = new Date(2026, 8, 28); // 28 de septiembre de 2026
function diasParaEnarm() {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  return Math.round((ENARM_FECHA - hoy) / 86400000);
}
function fechaBonita() {
  return new Date().toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });
}
function textoEnarm() {
  const dias = diasParaEnarm();
  if (dias > 1) return `ENARM en ${dias} días`;
  if (dias === 1) return "¡El ENARM es mañana!";
  if (dias === 0) return "¡Hoy es el ENARM! 🍀";
  return "ENARM presentado 🎓";
}

/* ========= historial de salas recientes ========= */
const leerSalasRecientes = () => { try { return JSON.parse(localStorage.getItem("cuckoo-salas-recientes") || "[]"); } catch (e) { return []; } };
const guardarSalaReciente = (s) => { const l = [s, ...leerSalasRecientes().filter(x => x !== s)].slice(0, 5); localStorage.setItem("cuckoo-salas-recientes", JSON.stringify(l)); };

/* ========= estado ========= */
const myId = idNuevo();
// Identidad estable por dispositivo: permite saber si un perfil es NUEVO en la sala
const uid = localStorage.getItem("cuckoo-uid") || (() => { const u = idNuevo(); localStorage.setItem("cuckoo-uid", u); return u; })();
const FACES = ["🧑\u200d⚕️", "👩\u200d⚕️", "🧑\u200d💻", "🧠", "📚"];

// tweaks: reshapean el ánimo visual completo de la app
const PALETTES = {
  violeta: { label: "Violeta", bg: "linear-gradient(135deg,#5366da,#7060ed)", breakBg: "linear-gradient(135deg,#02bde8,#08aee7)", doneBg: "linear-gradient(135deg,#ff2b96,#ff2586)", ringBase: "#6460ec", ringBreak: "#06b8ed", ringDone: "#ff278f" },
  bosque: { label: "Bosque", bg: "linear-gradient(135deg,#1f8a5f,#2fae7a)", breakBg: "linear-gradient(135deg,#12b3a8,#0e8f8a)", doneBg: "linear-gradient(135deg,#e8a23c,#d97b2b)", ringBase: "#279368", ringBreak: "#0f9c92", ringDone: "#dd8a30" },
  medianoche: { label: "Medianoche", bg: "linear-gradient(135deg,#242b52,#3a3d7a)", breakBg: "linear-gradient(135deg,#1f6f8b,#164f66)", doneBg: "linear-gradient(135deg,#b23a6b,#8c2c56)", ringBase: "#31386b", ringBreak: "#1c6883", ringDone: "#a53865" },
  atardecer: { label: "Atardecer", bg: "linear-gradient(135deg,#ff5e7e,#ff9a5c)", breakBg: "linear-gradient(135deg,#00c2b8,#0aa2c0)", doneBg: "linear-gradient(135deg,#7c5cff,#5f45e6)", ringBase: "#ff7a6b", ringBreak: "#05b1bb", ringDone: "#6d52f2" },
};
const ENERGY = {
  calma: { grad: 24, float: 10, pulse: 9, bounce: 2.6, breathe: 1.6 },
  normal: { grad: 16, float: 7, pulse: 6.5, bounce: 1.8, breathe: 1 },
  viva: { grad: 9, float: 4, pulse: 4, bounce: 1.1, breathe: .6 },
};
function getPalette() { return PALETTES[st.tweakPaleta] || PALETTES.violeta; }
function getEnergy() { return ENERGY[st.tweakEnergia] || ENERGY.normal; }

const st = {
  // Reconexión directa: si ya hay sala y nombre guardados, entra directo a la última sala
  screen: (params.get("sala") || localStorage.getItem("cuckoo-slug")) ? (localStorage.getItem("cuckoo-nombre") ? "room" : "profile") : "landing",
  slug: (params.get("sala") || localStorage.getItem("cuckoo-slug") || "sala-enarm").trim(),
  name: localStorage.getItem("cuckoo-nombre") || "",
  face: localStorage.getItem("cuckoo-cara") || "🧑\u200d⚕️",
  focusMin: Number(localStorage.getItem("cuckoo-focusMin")) || 50,
  breakMin: Number(localStorage.getItem("cuckoo-breakMin")) || 10,
  mode: "work",
  flashMin: null,
  metaDiaria: Math.max(10, Number(localStorage.getItem("cuckoo-meta-diaria")) || 120),
  ambiente: null,
  clockOffset: 0,
  autoEn: null,
  configFB: null,
  breatheCount: null,
  customOpen: false,
  customValue: 50,
  detailsOpen: false,
  tweaksOpen: false,
  tweakPaleta: localStorage.getItem("cuckoo-paleta") || "violeta",
  tweakEnergia: localStorage.getItem("cuckoo-energia") || "normal",
  tweakTimerStyle: localStorage.getItem("cuckoo-estilotimer") || "anillo",
  soundOn: localStorage.getItem("cuckoo-sound") !== "0",
  metaInput: "",
  toastMsg: "",
  toastShow: false,
  gente: {},       // gente REAL conectada — nunca inventada
  timerFB: null,   // estado compartido del bloque actual, o null
  historial: {},   // { personId: { pushId: {fecha, minutos, modo} } }
  metas: {},       // { pushId: {texto, hecho, autor, cara, ts} } — metas compartidas de la sala
};
let backend = null;
let toastTimer = null;
let renderInterval = null;
let latidoInterval = null;
let presenciaInterval = null;
let breatheTimer = null;
let creditedFor = null;
let autoTimer = null;   // cuenta regresiva del arranque automático del siguiente bloque
let finRendered = null; // para reconstruir la pantalla UNA sola vez por bloque terminado

/* ========= sonido / notificaciones ========= */
function alarmSound() {
  // ¡Cu-cú! — dos notas descendentes como un reloj cucu real, tres veces
  if (!st.soundOn) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    const a = new AC();
    if (a.state === "suspended") a.resume().catch(() => {});
    let t = a.currentTime + 0.05;
    for (let i = 0; i < 3; i++) {
      [[784, 0.24], [622, 0.34]].forEach(([f, d], j) => {
        const o = a.createOscillator(), g = a.createGain();
        o.connect(g); g.connect(a.destination);
        o.type = "triangle";
        o.frequency.value = f;
        const ini = t + j * 0.28;
        g.gain.setValueAtTime(0, ini);
        g.gain.linearRampToValueAtTime(0.22, ini + 0.03);
        g.gain.exponentialRampToValueAtTime(0.001, ini + d);
        o.start(ini); o.stop(ini + d + 0.05);
      });
      t += 1.05;
    }
  } catch (e) {}
}

/* ========= sonidos ambiente (lluvia / café / ruido blanco) ========= */
let ambCtx = null, ambNodes = [];
function pararAmbiente() {
  ambNodes.forEach(n => { try { if (n.stop) n.stop(); n.disconnect(); } catch (e) {} });
  ambNodes = [];
  if (ambCtx) { try { ambCtx.close(); } catch (e) {} ambCtx = null; }
}
function setAmbiente(tipo) {
  const nuevo = st.ambiente === tipo ? null : tipo;
  pararAmbiente();
  st.ambiente = nuevo;
  if (!nuevo) { render(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    ambCtx = new AC();
    const buf = ambCtx.createBuffer(1, ambCtx.sampleRate * 2, ambCtx.sampleRate);
    const data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < data.length; i++) {
      const w = Math.random() * 2 - 1;
      if (nuevo === "cafe") { last = (last + 0.02 * w) / 1.02; data[i] = last * 3.5; }
      else data[i] = w;
    }
    const src = ambCtx.createBufferSource(); src.buffer = buf; src.loop = true;
    const filt = ambCtx.createBiquadFilter();
    const g = ambCtx.createGain();
    if (nuevo === "lluvia") { filt.type = "bandpass"; filt.frequency.value = 1500; filt.Q.value = 0.5; g.gain.value = 0.06; }
    else if (nuevo === "cafe") { filt.type = "lowpass"; filt.frequency.value = 500; g.gain.value = 0.16; }
    else { filt.type = "lowpass"; filt.frequency.value = 4000; g.gain.value = 0.04; }
    src.connect(filt); filt.connect(g); g.connect(ambCtx.destination);
    src.start();
    ambNodes = [src, filt, g];
    if (nuevo === "lluvia") {
      const lfo = ambCtx.createOscillator(), lg = ambCtx.createGain();
      lfo.frequency.value = 0.18; lg.gain.value = 0.025;
      lfo.connect(lg); lg.connect(g.gain); lfo.start();
      ambNodes.push(lfo, lg);
    }
  } catch (e) {}
  render();
}
function notify(texto) {
  if (!st.soundOn) return;
  try {
    if ("Notification" in window) {
      if (Notification.permission === "granted") new Notification("Río ENARM", { body: texto });
      else if (Notification.permission !== "denied") Notification.requestPermission();
    }
  } catch (e) {}
}
function showToast(msg) {
  clearTimeout(toastTimer);
  st.toastMsg = msg; st.toastShow = true; render();
  toastTimer = setTimeout(() => { st.toastShow = false; render(); }, 1800);
}

/* ========= Firebase — reemplaza localStorage+BroadcastChannel del original ========= */
async function crearBackend() {
  const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const dbMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  const app = appMod.initializeApp(FIREBASE);
  const db = dbMod.getDatabase(app);
  dbMod.onValue(dbMod.ref(db, ".info/serverTimeOffset"), (snap) => { st.clockOffset = snap.val() || 0; });
  let unsubs = [];

  function refs(s) {
    return {
      gente: dbMod.ref(db, `salas/${s}/gente`),
      yo: dbMod.ref(db, `salas/${s}/gente/${myId}`),
      timer: dbMod.ref(db, `salas/${s}/timer`),
      historial: dbMod.ref(db, `salas/${s}/historial`),
      miHistorial: dbMod.ref(db, `salas/${s}/historial/${myId}`),
      metas: dbMod.ref(db, `salas/${s}/metas`),
      ultimaSalida: dbMod.ref(db, `salas/${s}/ultimaSalida`),
      config: dbMod.ref(db, `salas/${s}/config`),
      perfiles: dbMod.ref(db, `salas/${s}/perfiles`),
    };
  }

  return {
    async unirseA(s) {
      unsubs.forEach(u => u && u()); unsubs = [];
      const r = refs(s);
      // Si la sala llevaba 3+ horas vacía, se reinician sus estadísticas y metas
      try {
        const [snapGente, snapSalida] = await Promise.all([dbMod.get(r.gente), dbMod.get(r.ultimaSalida)]);
        const gente = snapGente.val() || {};
        const hayAlguien = Object.values(gente).some(p => Date.now() - (p.visto || 0) < 45000);
        const ultimaSalida = snapSalida.val() || 0;
        if (!hayAlguien && ultimaSalida && Date.now() - ultimaSalida > 3 * 3600000) {
          await Promise.all([dbMod.remove(r.historial), dbMod.remove(r.metas), dbMod.remove(r.timer)]);
        }
      } catch (e) {}
      dbMod.onDisconnect(r.yo).remove();
      dbMod.onDisconnect(r.ultimaSalida).set(dbMod.serverTimestamp());
      dbMod.set(r.yo, { nombre: st.name, cara: st.face, visto: Date.now() });
      // Aviso discreto SOLO cuando alguien se une a la sala por primera vez
      // (no en cada entrada/salida, para no interrumpir el estudio)
      const miPerfil = dbMod.ref(db, `salas/${s}/perfiles/${uid}`);
      dbMod.get(miPerfil).then((snap) => {
        if (!snap.exists()) dbMod.set(miPerfil, { nombre: st.name, cara: st.face, creadoEn: dbMod.serverTimestamp() });
        else dbMod.update(miPerfil, { nombre: st.name, cara: st.face });
      }).catch(() => {});
      unsubs.push(dbMod.onChildAdded(r.perfiles, (snap) => {
        const p = snap.val() || {};
        if (snap.key !== uid && p.creadoEn && ahora() - p.creadoEn < 30000) showToast(`${p.cara || "🙂"} ¡${p.nombre} se unió a Río!`);
      }));
      unsubs.push(dbMod.onValue(r.gente, (snap) => { st.gente = snap.val() || {}; render(); }));
      unsubs.push(dbMod.onValue(r.timer, (snap) => {
        const nuevo = snap.val();
        if (!nuevo || !st.timerFB || nuevo.iniciadoEn !== st.timerFB.iniciadoEn) { creditedFor = null; clearInterval(autoTimer); st.autoEn = null; }
        // Le avisa a la app la hora exacta del fin del bloque, para que el
        // cucú suene de forma nativa aunque la tarjeta esté oculta
        if (window.__TAURI__ && window.__TAURI__.event) {
          const fin = nuevo && !nuevo.pausado ? (nuevo.iniciadoEn + nuevo.duracionMs - (st.clockOffset || 0)) : 0;
          window.__TAURI__.event.emit("cuckoo-fin", String(fin)).catch(() => {});
        }
        st.timerFB = nuevo; render();
      }));
      unsubs.push(dbMod.onValue(r.historial, (snap) => { st.historial = snap.val() || {}; render(); }));
      unsubs.push(dbMod.onValue(r.metas, (snap) => { st.metas = snap.val() || {}; render(); }));
      unsubs.push(dbMod.onValue(r.config, (snap) => { st.configFB = snap.val(); render(); }));
    },
    latido(s) { if (!document.hidden) dbMod.update(refs(s).yo, { visto: Date.now() }); },
    salir(s) { dbMod.set(refs(s).ultimaSalida, Date.now()).catch(() => {}); dbMod.remove(refs(s).yo).catch(() => {}); unsubs.forEach(u => u && u()); unsubs = []; st.gente = {}; st.timerFB = null; st.metas = {}; st.configFB = null; },
    iniciar(s, modo, minutos) { dbMod.set(refs(s).timer, { modo, duracionMs: minutos * 60000, iniciadoEn: ahora(), pausado: false, restanteAlPausar: null }); },
    pausar(s) { const t = st.timerFB; if (!t) return; const restante = t.duracionMs - (ahora() - t.iniciadoEn); dbMod.update(refs(s).timer, { pausado: true, restanteAlPausar: restante }); },
    reanudar(s) { const t = st.timerFB; if (!t) return; dbMod.update(refs(s).timer, { pausado: false, iniciadoEn: ahora() - (t.duracionMs - t.restanteAlPausar) }); },
    detener(s) { dbMod.set(refs(s).timer, null); },
    guardarConfig(s, cambios) { dbMod.update(refs(s).config, cambios).catch(() => {}); },
    // Arranca el siguiente bloque de forma atómica (transacción): si alguien más
    // ya lo arrancó, la operación se cancela sola. Adiós a los choques entre 4 clics.
    avanzar(s, viejoIniciadoEn, modo, minutos) {
      return dbMod.runTransaction(refs(s).timer, (t) => {
        if (!t || t.pausado || t.iniciadoEn !== viejoIniciadoEn) return; // alguien ya avanzó
        return { modo, duracionMs: minutos * 60000, iniciadoEn: ahora(), pausado: false, restanteAlPausar: null };
      }).catch(() => {});
    },
    acreditar(s, minutos, modo) { dbMod.push(refs(s).miHistorial, { fecha: hoyISO(), minutos, modo }); },
    agregarMeta(s, texto) { dbMod.push(refs(s).metas, { texto, hecho: false, autor: st.name, cara: st.face, ts: Date.now() }); },
    toggleMeta(s, id, hecho) { dbMod.update(dbMod.ref(db, `salas/${s}/metas/${id}`), { hecho: !hecho }); },
    quitarMeta(s, id) { dbMod.remove(dbMod.ref(db, `salas/${s}/metas/${id}`)); },
  };
}

/* ========= cálculo del bloque compartido ========= */
// Hora corregida: Date.now() de cada Mac puede estar desfasado varios segundos;
// sumando el offset del servidor de Firebase, los 4 relojes marcan lo mismo.
function ahora() { return Date.now() + (st.clockOffset || 0); }
function restanteSegundos() {
  const t = st.timerFB;
  if (!t) return null;
  const ms = t.pausado ? t.restanteAlPausar : t.duracionMs - (ahora() - t.iniciadoEn);
  return ms / 1000;
}
function modoEfectivo() { return st.timerFB ? st.timerFB.modo : st.mode; }
// Duraciones compartidas de la sala (Firebase). Si la sala aún no define nada,
// se usa la preferencia local de cada quien.

function breakMinEfectivo() { return (st.configFB && st.configFB.breakMin) || st.breakMin; }

function revisarFin() {
  const t = st.timerFB;
  if (!t || t.pausado) return;
  const restante = restanteSegundos();
  if (restante > 0) return;
  if (creditedFor === t.iniciadoEn) return;
  creditedFor = t.iniciadoEn;
  const minutos = Math.round(t.duracionMs / 60000);
  if (backend) backend.acreditar(st.slug, minutos, t.modo);
  if (!window.__TAURI__) alarmSound(); // en la app el cucú suena nativo, aunque esté oculta
  notify(t.modo === "work" ? "Tu sesión de enfoque terminó 🎉" : "Tu descanso terminó, ¡de vuelta al estudio!");
  // Encadenado automático: enfoque → descanso → enfoque, en loop.
  // (Solo si el bloque acaba de terminar; si es un timer viejo abandonado, no arranca nada.)
  if (restante > -60) {
    const viejo = t.iniciadoEn;
    const proximoModo = t.modo === "work" ? "break" : "work";
    const proximosMin = proximoModo === "work" ? focusMinEfectivo() : breakMinEfectivo();
    st.autoEn = 6;
    clearInterval(autoTimer);
    autoTimer = setInterval(() => {
      const tt = st.timerFB;
      if (!tt || tt.iniciadoEn !== viejo) { clearInterval(autoTimer); st.autoEn = null; return; }
      st.autoEn -= 1;
      const el = document.getElementById("auto-count");
      if (el) el.textContent = st.autoEn;
      if (st.autoEn <= 0) {
        clearInterval(autoTimer); st.autoEn = null;
        if (backend) backend.avanzar(st.slug, viejo, proximoModo, proximosMin);
      }
    }, 1000);
  }
}

function computeStreak() {
  const mias = Object.values(st.historial[myId] || {});
  if (!mias.length) return 0;
  const dias = new Set(mias.map(h => h.fecha));
  const ordenados = [...dias].sort().reverse();
  let streak = 0, d = new Date(ordenados[0] + "T00:00:00");
  while (dias.has(d.toISOString().slice(0, 10))) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}

${(() => { const mios = planos.filter(h => h.pid === myId && h.fecha === hoy && h.modo === "work").reduce((s, h) => s + h.minutos, 0); const p = Math.min(100, Math.round(mios / st.metaDiaria * 100)); return `<div style="background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;margin-bottom:22px"><div style="display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:6px"><span>${p >= 100 ? "🎉 ¡Meta cumplida!" : "Hoy llevas"}</span><span style="color:rgba(255,255,255,.7)">${mios} / ${st.metaDiaria} min</span></div><div style="height:7px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden"><div style="height:100%;width:${p}%;background:${p >= 100 ? "#3ddc84" : "#fff"};border-radius:4px;transition:width .6s ease"></div></div></div>`; })()}
<div style="font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:10px">Últimos 7 días de la sala</div>
${(() => { const ds = []; const hd = new Date(); for (let i = 6; i >= 0; i--) { const d = new Date(hd); d.setDate(hd.getDate() - i); ds.push(d.toISOString().slice(0, 10)); } const tot = ds.map(f => planos.filter(h => h.fecha === f && h.modo === "work").reduce((s, h) => s + h.minutos, 0)); const mx = Math.max(...tot, 1); const ini = ["D", "L", "M", "X", "J", "V", "S"]; return `<div style="display:flex;align-items:flex-end;gap:8px;background:rgba(255,255,255,.08);border-radius:12px;padding:14px 14px 10px;margin-bottom:22px">${ds.map((f, i) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px"><div style="font-size:.58rem;color:rgba(255,255,255,.7)">${tot[i] ? tot[i] : ""}</div><div title="${tot[i]} min" style="width:100%;max-width:26px;height:${Math.max(4, Math.round(tot[i] / mx * 52))}px;background:${i === 6 ? "#fff" : "rgba(255,255,255,.45)"};border-radius:5px 5px 2px 2px"></div><div style="font-size:.6rem;color:rgba(255,255,255,${i === 6 ? ".95" : ".55"})">${ini[new Date(f + "T00:00:00").getDay()]}</div></div>`).join("")}</div>`; })()}
<div style="font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:10px">Por integrante hoy</div>
<div style="display:flex;flex-direction:column;gap:10px">
${memberStats.length ? memberStats.map((ms, idx) => `
<div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 14px">
<span style="width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1rem;flex-shrink:0">${esc(ms.face)}</span>
<div style="flex:1;min-width:0">
<div style="display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:5px;gap:8px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ms.minutes > 0 && idx < 3 ? ["🥇 ", "🥈 ", "🥉 "][idx] : ""}${esc(ms.name)}${ms.minutes >= st.metaDiaria ? " ⭐" : ""}</span><span style="color:rgba(255,255,255,.7);flex-shrink:0">${ms.minutes} min</span></div>
<div style="height:5px;background:rgba(255,255,255,.15);border-radius:3px"><div style="height:100%;width:${Math.round(ms.minutes / maxMin * 100)}%;background:#fff;border-radius:3px"></div></div>
</div>
</div>`).join("") : `<div style="color:rgba(255,255,255,.5);font-size:.85rem">Nadie ha completado un bloque todavía.</div>`}
</div>
</div>

</div>
</div>

${st.detailsOpen ? `
<div style="position:fixed;inset:0;background:rgba(25,25,93,.97);z-index:20;padding:40px 26px;overflow:auto;text-align:left;animation:fadeUp .3s ease">
<div style="width:min(480px,100%);margin:0 auto">
<button id="btn-cerrar-ajustes" style="float:right;border:0;background:transparent;color:#fff;font-size:1.6rem;cursor:pointer">×</button>
<h2 style="margin:6px 0 24px;clear:both;font-family:'Manrope',sans-serif;font-size:1.3rem">Ajustes</h2>
<label style="display:block;font-size:.7rem;margin-top:8px">Estudio de la sala (min) — se sincroniza para todos
<input id="in-focus" type="number" min="1" max="240" value="${focusMinEfectivo()}" style="width:100%;padding:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.34);color:#fff;margin-top:5px;border-radius:8px;font-family:inherit">
</label>
<label style="display:block;font-size:.7rem;margin-top:14px">Descanso de la sala (min) — se sincroniza para todos
<input id="in-break" type="number" min="1" max="60" value="${breakMinEfectivo()}" style="width:100%;padding:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.34);color:#fff;margin-top:5px;border-radius:8px;font-family:inherit">
</label>
<button id="btn-sonido" style="width:100%;margin-top:10px;border:1px solid rgba(255,255,255,.34);background:transparent;color:#fff;padding:13px;border-radius:8px;font-weight:700;cursor:pointer">${st.soundOn ? "🔔 Sonido y notificaciones activadas" : "🔕 Sonido y notificaciones desactivadas"}</button>
<label style="display:block;font-size:.7rem;margin-top:22px">Mi meta diaria de estudio (min)
<input id="in-meta-diaria" type="number" min="10" max="960" value="${st.metaDiaria}" style="width:100%;padding:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.34);color:#fff;margin-top:5px;border-radius:8px;font-family:inherit">
</label>
<div style="font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);margin:22px 0 10px">Sonido ambiente</div>
<div style="display:flex;gap:10px">
${[["lluvia","🌧️ Lluvia"],["cafe","☕ Café"],["blanco","📻 Blanco"]].map(([key,label]) => `<button data-amb="${key}" class="btn-ambiente" style="flex:1;padding:12px 6px;border-radius:10px;border:0;cursor:pointer;font-family:inherit;font-size:.8rem;font-weight:700;background:${st.ambiente===key?"#fff":"rgba(255,255,255,.12)"};color:${st.ambiente===key?"#5360d8":"#fff"}">${label}</button>`).join("")}
</div>
<p style="margin:8px 0 0;font-size:.68rem;color:rgba(255,255,255,.5)">Toca de nuevo el mismo botón para apagarlo.</p>
</div>
</div>` : ""}

${st.tweaksOpen ? `
<div style="position:fixed;inset:0;background:rgba(25,25,93,.97);z-index:20;padding:40px 26px;overflow:auto;text-align:left;animation:fadeUp .3s ease">
<div style="width:min(480px,100%);margin:0 auto">
<button id="btn-cerrar-tweaks" style="float:right;border:0;background:transparent;color:#fff;font-size:1.6rem;cursor:pointer">×</button>
<h2 style="margin:6px 0 6px;clear:both;font-family:'Manrope',sans-serif;font-size:1.3rem">Apariencia</h2>
<p style="margin:0 0 24px;font-size:.8rem;color:rgba(255,255,255,.6)">Cambia el ánimo visual de la sala para todos.</p>

<div style="font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:10px">Paleta</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px">
${Object.entries(PALETTES).map(([key, p]) => `<button data-paleta="${key}" class="btn-paleta" style="padding:10px 16px;border-radius:20px;border:2px solid ${st.tweakPaleta===key?"#fff":"rgba(255,255,255,.25)"};cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:700;color:#fff;background:${p.bg}">${p.label}</button>`).join("")}
</div>

<div style="font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:10px">Energía visual</div>
<div style="display:flex;gap:10px;margin-bottom:26px">
${[["calma","Calma"],["normal","Normal"],["viva","Viva"]].map(([key,label]) => `<button data-energia="${key}" class="btn-energia" style="flex:1;padding:10px;border-radius:10px;border:0;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:700;background:${st.tweakEnergia===key?"#fff":"rgba(255,255,255,.12)"};color:${st.tweakEnergia===key?"#5360d8":"#fff"}">${label}</button>`).join("")}
</div>

<div style="font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:10px">Estilo del temporizador</div>
<div style="display:flex;gap:10px">
${[["anillo","Anillo"],["minimal","Minimalista"]].map(([key,label]) => `<button data-timerstyle="${key}" class="btn-timerstyle" style="flex:1;padding:10px;border-radius:10px;border:0;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:700;background:${st.tweakTimerStyle===key?"#fff":"rgba(255,255,255,.12)"};color:${st.tweakTimerStyle===key?"#5360d8":"#fff"}">${label}</button>`).join("")}
</div>

</div>
</div>` : ""}
</div>
</div>`;

  document.querySelectorAll(".btn-dur").forEach(b => b.addEventListener("click", () => selectDurationClick(Number(b.dataset.min), b)));
  const bca = document.getElementById("btn-custom-abrir"); if (bca) bca.addEventListener("click", openCustom);
  const bco = document.getElementById("btn-custom-ok"); if (bco) bco.addEventListener("click", () => { st.customValue = document.getElementById("in-custom").value; confirmCustom(); });
  const bsd = document.getElementById("btn-saltar-descanso"); if (bsd) bsd.addEventListener("click", skipBreak);
  document.getElementById("btn-toggle").addEventListener("click", toggle);
  document.getElementById("btn-reset").addEventListener("click", resetTimer);
  document.getElementById("btn-modo").addEventListener("click", changeMode);
  document.getElementById("btn-ajustes").addEventListener("click", openDetailsInfo);
  document.getElementById("btn-salir").addEventListener("click", goLandingScreen);
  document.getElementById("btn-invitar").addEventListener("click", addMemberPrompt);
  const bce = document.getElementById("btn-cerrar-ajustes"); if (bce) bce.addEventListener("click", closeDetails);
  const inFocus = document.getElementById("in-focus"); if (inFocus) inFocus.addEventListener("change", e => setFocusMin(e.target.value));
  const inBreak = document.getElementById("in-break"); if (inBreak) inBreak.addEventListener("change", e => setBreakMin(e.target.value));
  const bsonido = document.getElementById("btn-sonido"); if (bsonido) bsonido.addEventListener("click", toggleSound);
  document.querySelectorAll(".btn-ambiente").forEach(b => b.addEventListener("click", () => setAmbiente(b.dataset.amb)));
  const imd = document.getElementById("in-meta-diaria"); if (imd) imd.addEventListener("change", e => { st.metaDiaria = Math.max(10, Math.min(960, Number(e.target.value) || 120)); localStorage.setItem("cuckoo-meta-diaria", st.metaDiaria); render(); });
  const inMeta = document.getElementById("in-meta");
  if (inMeta) { inMeta.addEventListener("input", e => st.metaInput = e.target.value); inMeta.addEventListener("keydown", e => { if (e.key === "Enter") addMeta(); }); }
  const bam = document.getElementById("btn-agregar-meta"); if (bam) bam.addEventListener("click", addMeta);
  document.querySelectorAll(".btn-meta-check").forEach(b => b.addEventListener("click", () => toggleMetaClick(b.dataset.id, b.dataset.hecho === "1")));
  document.querySelectorAll(".btn-meta-quitar").forEach(b => b.addEventListener("click", () => removeMetaClick(b.dataset.id)));
  const btw = document.getElementById("btn-tweaks"); if (btw) btw.addEventListener("click", openTweaks);
  const bct = document.getElementById("btn-cerrar-tweaks"); if (bct) bct.addEventListener("click", closeTweaks);
  document.querySelectorAll(".btn-paleta").forEach(b => b.addEventListener("click", () => setPaleta(b.dataset.paleta)));
  document.querySelectorAll(".btn-energia").forEach(b => b.addEventListener("click", () => setEnergia(b.dataset.energia)));
  document.querySelectorAll(".btn-timerstyle").forEach(b => b.addEventListener("click", () => setTimerStyle(b.dataset.timerstyle)));
}

/* ========= "tick" ligero: solo toca los números y el anillo, nunca reconstruye la pantalla ========= */
function tick() {
  if (st.screen !== "room" || st.breatheCount !== null) return;
  const t = st.timerFB;
  if (!t || t.pausado) return;
  const restante = restanteSegundos();
  if (restante <= 0) {
    // reconstruir UNA sola vez por bloque terminado; el redibujado constante
    // hacía parpadear el confeti y "se comía" los clics de los botones
    if (finRendered !== t.iniciadoEn) { finRendered = t.iniciadoEn; render(); }
    return;
  }
  const digits = document.getElementById("digits");
  if (digits) { const txt = fmt(restante); if (digits.textContent !== txt) digits.textContent = txt; }
  const total = t.duracionMs / 1000;
  const pct = Math.round(((total - restante) / total) * 100);
  const anillo = document.getElementById("anillo");
  if (anillo) anillo.style.background = `conic-gradient(#fff calc(${pct}*1%),rgba(255,255,255,.22) 0)`;
  const barra = document.getElementById("barra-minimal");
  if (barra) barra.style.width = pct + "%";
}

/* ========= arranque ========= */
// Reconexión directa: si ya tienes nombre y sala guardados, entras de inmediato a tu última sala
if (st.screen === "room" && st.name) {
  enterRoom();
} else {
  if (st.screen === "room") st.screen = "profile";
  render();
}
clearInterval(renderInterval);
renderInterval = setInterval(tick, 250);
(function tickFrame() { tick(); requestAnimationFrame(tickFrame); })();

// señal de vida cada 20s (solo si la ventana está a la vista) — así, quien deja
// la app abierta en segundo plano sin verla deja de contar como "conectado"
clearInterval(latidoInterval);
latidoInterval = setInterval(() => { if (backend && st.screen === "room") backend.latido(st.slug); }, 20000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && backend && st.screen === "room") backend.latido(st.slug);
});

// refresco lento para que los perfiles vencidos desaparezcan aunque nadie más cambie nada
clearInterval(presenciaInterval);
presenciaInterval = setInterval(() => { if (st.screen === "room") render(); }, 15000);
</script>
</body>
</html>
