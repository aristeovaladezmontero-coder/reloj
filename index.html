<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{overflow-x:hidden}
button{cursor:pointer;font-family:inherit}
input{font-family:inherit}
@keyframes floatYNormal{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-16px) rotate(2deg)}}
@keyframes floatYSlow{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(12px,-22px) scale(1.06)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.28);transform:scale(1)}50%{box-shadow:0 0 0 20px rgba(255,255,255,0);transform:scale(1.018)}}
@keyframes breathePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes bounceHint{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(6px);opacity:1}}
@keyframes nudgeRight{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(170px) rotate(340deg);opacity:0}}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes floatCard{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes shimmerSweep{0%{background-position:0% 0}100%{background-position:200% 0}}
.btn-dur{transition:transform .28s cubic-bezier(.2,.8,.3,1),box-shadow .28s,border-color .28s,background .28s}
.btn-dur:hover{transform:translateY(-8px);border-color:#fff;background:rgba(255,255,255,.24)}
.btn-dur:active{transform:translateY(-2px) scale(.97)}
.plus-icon{display:inline-block;transition:transform .3s}
#btn-custom-abrir:hover .plus-icon{transform:rotate(90deg)}
.btn-cta-primary{transition:transform .2s,box-shadow .2s}
.btn-cta-primary:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 10px 26px rgba(0,0,0,.3)}
.btn-cta-primary:active{transform:scale(.97)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">

/* ========= CONFIGURACIÓN FIREBASE (reloj-enarm) ========= */
const FIREBASE = {
  apiKey: "AIzaSyCurBiYUGckz1cpRmpTLWu_ketz12oIOoQ",
  databaseURL: "https://reloj-enarm-default-rtdb.firebaseio.com",
  projectId: "reloj-enarm"
};

const root = document.getElementById("root");
const esc = (s) => String(s ?? "").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const params = new URLSearchParams(location.search);
const idNuevo = () => Math.random().toString(36).slice(2, 10);
const hoyISO = () => new Date().toISOString().slice(0, 10);
function fmt(s) { s = Math.floor(Math.max(0, s)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }

/* ========= frases motivacionales — rotan automáticamente cada día ========= */
const FRASES = [
  "Cada bloque de estudio te acerca a tu especialidad.",
  "La constancia le gana al talento.",
  "Hoy estudias lo que mañana salvará una vida.",
  "Un día a la vez, una pregunta a la vez.",
  "Tu yo del futuro te va a agradecer este esfuerzo.",
  "No tiene que ser perfecto, tiene que ser constante.",
  "La disciplina es el puente entre tus metas y tus logros.",
  "Pequeños avances diarios crean resultados enormes.",
  "El ENARM no se gana en un día, se gana todos los días.",
  "Descansar también es parte de estudiar.",
  "Enfócate en el proceso, el resultado llegará.",
  "Cada repaso cuenta, aunque no lo sientas.",
  "Estudia con intención, descansa sin culpa.",
  "Eres más capaz de lo que crees.",
  "La mejor inversión es la que haces en ti.",
  "Un poco más cada día: así se construyen los sueños.",
  "Confía en tu preparación.",
  "Lo difícil de hoy será tu anécdota de mañana.",
  "No cuentes los días, haz que los días cuenten.",
  "Tu esfuerzo silencioso hará mucho ruido en los resultados.",
  "Nadie dijo que sería fácil, pero valdrá la pena.",
  "El éxito es la suma de pequeños esfuerzos repetidos.",
  "Hoy también es un buen día para avanzar.",
  "Respira, enfócate y continúa.",
];
function fraseDelDia() {
  const d = new Date();
  const dia = Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
  return FRASES[dia % FRASES.length];
}

/* ========= fecha y cuenta regresiva al ENARM ========= */
const ENARM_FECHA = new Date(2026, 8, 28); // 28 de septiembre de 2026
function diasParaEnarm() {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  return Math.round((ENARM_FECHA - hoy) / 86400000);
}
function fechaBonita() {
  return new Date().toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });
}
function textoEnarm() {
  const dias = diasParaEnarm();
  if (dias > 1) return `ENARM en ${dias} días`;
  if (dias === 1) return "¡El ENARM es mañana!";
  if (dias === 0) return "¡Hoy es el ENARM! 🍀";
  return "ENARM presentado 🎓";
}

/* ========= historial de salas recientes ========= */
const leerSalasRecientes = () => { try { return JSON.parse(localStorage.getItem("cuckoo-salas-recientes") || "[]"); } catch (e) { return []; } };
const guardarSalaReciente = (s) => { const l = [s, ...leerSalasRecientes().filter(x => x !== s)].slice(0, 5); localStorage.setItem("cuckoo-salas-recientes", JSON.stringify(l)); };

/* ========= estado ========= */
const myId = idNuevo();
const FACES = ["🧑\u200d⚕️", "👩\u200d⚕️", "🧑\u200d💻", "🧠", "📚"];

// tweaks: reshapean el ánimo visual completo de la app
const PALETTES = {
  violeta: { label: "Violeta", bg: "linear-gradient(135deg,#5366da,#7060ed)", breakBg: "linear-gradient(135deg,#02bde8,#08aee7)", doneBg: "linear-gradient(135deg,#ff2b96,#ff2586)", ringBase: "#6460ec", ringBreak: "#06b8ed", ringDone: "#ff278f" },
  bosque: { label: "Bosque", bg: "linear-gradient(135deg,#1f8a5f,#2fae7a)", breakBg: "linear-gradient(135deg,#12b3a8,#0e8f8a)", doneBg: "linear-gradient(135deg,#e8a23c,#d97b2b)", ringBase: "#279368", ringBreak: "#0f9c92", ringDone: "#dd8a30" },
  medianoche: { label: "Medianoche", bg: "linear-gradient(135deg,#242b52,#3a3d7a)", breakBg: "linear-gradient(135deg,#1f6f8b,#164f66)", doneBg: "linear-gradient(135deg,#b23a6b,#8c2c56)", ringBase: "#31386b", ringBreak: "#1c6883", ringDone: "#a53865" },
};
const ENERGY = {
  calma: { grad: 24, float: 10, pulse: 9, bounce: 2.6, breathe: 1.6 },
  normal: { grad: 16, float: 7, pulse: 6.5, bounce: 1.8, breathe: 1 },
  viva: { grad: 9, float: 4, pulse: 4, bounce: 1.1, breathe: .6 },
};
function getPalette() { return PALETTES[st.tweakPaleta] || PALETTES.violeta; }
function getEnergy() { return ENERGY[st.tweakEnergia] || ENERGY.normal; }

const st = {
  // Reconexión directa: si ya hay sala y nombre guardados, entra directo a la última sala
  screen: (params.get("sala") || localStorage.getItem("cuckoo-slug")) ? (localStorage.getItem("cuckoo-nombre") ? "room" : "profile") : "landing",
  slug: (params.get("sala") || localStorage.getItem("cuckoo-slug") || "sala-enarm").trim(),
  name: localStorage.getItem("cuckoo-nombre") || "",
  face: localStorage.getItem("cuckoo-cara") || "🧑\u200d⚕️",
  focusMin: Number(localStorage.getItem("cuckoo-focusMin")) || 50,
  breakMin: Number(localStorage.getItem("cuckoo-breakMin")) || 10,
  mode: "work",
  flashMin: null,
  breatheCount: null,
  customOpen: false,
  customValue: 50,
  detailsOpen: false,
  tweaksOpen: false,
  tweakPaleta: localStorage.getItem("cuckoo-paleta") || "violeta",
  tweakEnergia: localStorage.getItem("cuckoo-energia") || "normal",
  tweakTimerStyle: localStorage.getItem("cuckoo-estilotimer") || "anillo",
  soundOn: localStorage.getItem("cuckoo-sound") !== "0",
  metaInput: "",
  toastMsg: "",
  toastShow: false,
  gente: {},       // gente REAL conectada — nunca inventada
  timerFB: null,   // estado compartido del bloque actual, o null
  historial: {},   // { personId: { pushId: {fecha, minutos, modo} } }
  metas: {},       // { pushId: {texto, hecho, autor, cara, ts} } — metas compartidas de la sala
};
let backend = null;
let toastTimer = null;
let renderInterval = null;
let latidoInterval = null;
let presenciaInterval = null;
let breatheTimer = null;
let creditedFor = null;

/* ========= sonido / notificaciones ========= */
function alarmSound() {
  if (!st.soundOn) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    const a = new AC();
    let t = a.currentTime + 0.02, count = 0;
    while (t < a.currentTime + 6) {
      const o = a.createOscillator(), g = a.createGain();
      o.connect(g); g.connect(a.destination);
      o.type = "sine";
      o.frequency.value = count % 2 === 0 ? 880 : 720;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.02);
      g.gain.linearRampToValueAtTime(0, t + 0.28);
      o.start(t); o.stop(t + 0.3);
      t += 0.52; count++;
    }
  } catch (e) {}
}
function notify(texto) {
  if (!st.soundOn) return;
  try {
    if ("Notification" in window) {
      if (Notification.permission === "granted") new Notification("Cuckoo ENARM", { body: texto });
      else if (Notification.permission !== "denied") Notification.requestPermission();
    }
  } catch (e) {}
}
function showToast(msg) {
  clearTimeout(toastTimer);
  st.toastMsg = msg; st.toastShow = true; render();
  toastTimer = setTimeout(() => { st.toastShow = false; render(); }, 1800);
}

/* ========= Firebase — reemplaza localStorage+BroadcastChannel del original ========= */
async function crearBackend() {
  const appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
  const dbMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js");
  const app = appMod.initializeApp(FIREBASE);
  const db = dbMod.getDatabase(app);
  let unsubs = [];

  function refs(s) {
    return {
      gente: dbMod.ref(db, `salas/${s}/gente`),
      yo: dbMod.ref(db, `salas/${s}/gente/${myId}`),
      timer: dbMod.ref(db, `salas/${s}/timer`),
      historial: dbMod.ref(db, `salas/${s}/historial`),
      miHistorial: dbMod.ref(db, `salas/${s}/historial/${myId}`),
      metas: dbMod.ref(db, `salas/${s}/metas`),
      ultimaSalida: dbMod.ref(db, `salas/${s}/ultimaSalida`),
    };
  }

  return {
    async unirseA(s) {
      unsubs.forEach(u => u && u()); unsubs = [];
      const r = refs(s);
      // Si la sala llevaba 3+ horas vacía, se reinician sus estadísticas y metas
      try {
        const [snapGente, snapSalida] = await Promise.all([dbMod.get(r.gente), dbMod.get(r.ultimaSalida)]);
        const gente = snapGente.val() || {};
        const hayAlguien = Object.values(gente).some(p => Date.now() - (p.visto || 0) < 45000);
        const ultimaSalida = snapSalida.val() || 0;
        if (!hayAlguien && ultimaSalida && Date.now() - ultimaSalida > 3 * 3600000) {
          await Promise.all([dbMod.remove(r.historial), dbMod.remove(r.metas), dbMod.remove(r.timer)]);
        }
      } catch (e) {}
      dbMod.onDisconnect(r.yo).remove();
      dbMod.onDisconnect(r.ultimaSalida).set(dbMod.serverTimestamp());
      dbMod.set(r.yo, { nombre: st.name, cara: st.face, visto: Date.now() });
      unsubs.push(dbMod.onValue(r.gente, (snap) => { st.gente = snap.val() || {}; render(); }));
      unsubs.push(dbMod.onValue(r.timer, (snap) => {
        const nuevo = snap.val();
        if (!nuevo || !st.timerFB || nuevo.iniciadoEn !== st.timerFB.iniciadoEn) creditedFor = null;
        st.timerFB = nuevo; render();
      }));
      unsubs.push(dbMod.onValue(r.historial, (snap) => { st.historial = snap.val() || {}; render(); }));
      unsubs.push(dbMod.onValue(r.metas, (snap) => { st.metas = snap.val() || {}; render(); }));
    },
    latido(s) { if (!document.hidden) dbMod.update(refs(s).yo, { visto: Date.now() }); },
    salir(s) { dbMod.set(refs(s).ultimaSalida, Date.now()).catch(() => {}); dbMod.remove(refs(s).yo).catch(() => {}); unsubs.forEach(u => u && u()); unsubs = []; st.gente = {}; st.timerFB = null; st.metas = {}; },
    iniciar(s, modo, minutos) { dbMod.set(refs(s).timer, { modo, duracionMs: minutos * 60000, iniciadoEn: Date.now(), pausado: false, restanteAlPausar: null }); },
    pausar(s) { const t = st.timerFB; if (!t) return; const restante = t.duracionMs - (Date.now() - t.iniciadoEn); dbMod.update(refs(s).timer, { pausado: true, restanteAlPausar: restante }); },
    reanudar(s) { const t = st.timerFB; if (!t) return; dbMod.update(refs(s).timer, { pausado: false, iniciadoEn: Date.now() - (t.duracionMs - t.restanteAlPausar) }); },
    detener(s) { dbMod.set(refs(s).timer, null); },
    acreditar(s, minutos, modo) { dbMod.push(refs(s).miHistorial, { fecha: hoyISO(), minutos, modo }); },
    agregarMeta(s, texto) { dbMod.push(refs(s).metas, { texto, hecho: false, autor: st.name, cara: st.face, ts: Date.now() }); },
    toggleMeta(s, id, hecho) { dbMod.update(dbMod.ref(db, `salas/${s}/metas/${id}`), { hecho: !hecho }); },
    quitarMeta(s, id) { dbMod.remove(dbMod.ref(db, `salas/${s}/metas/${id}`)); },
  };
}

/* ========= cálculo del bloque compartido ========= */
function restanteSegundos() {
  const t = st.timerFB;
  if (!t) return null;
  const ms = t.pausado ? t.restanteAlPausar : t.duracionMs - (Date.now() - t.iniciadoEn);
  return ms / 1000;
}
function modoEfectivo() { return st.timerFB ? st.timerFB.modo : st.mode; }

function revisarFin() {
  const t = st.timerFB;
  if (!t || t.pausado) return;
  const restante = restanteSegundos();
  if (restante > 0) return;
  if (creditedFor === t.iniciadoEn) return;
  creditedFor = t.iniciadoEn;
  const minutos = Math.round(t.duracionMs / 60000);
  if (backend) backend.acreditar(st.slug, minutos, t.modo);
  alarmSound();
  notify(t.modo === "work" ? "Tu sesión de enfoque terminó 🎉" : "Tu descanso terminó, ¡de vuelta al estudio!");
}

/* ========= navegación / acciones ========= */
function goProfileScreen() {
  st.slug = (st.slug || "").trim().toLowerCase().replace(/[^a-z0-9-]/g, "-").slice(0, 20) || "sala-enarm";
  localStorage.setItem("cuckoo-slug", st.slug);
  st.screen = "profile"; render();
}
async function enterRoom() {
  st.name = (st.name || "").trim().slice(0, 22) || "Invitado";
  localStorage.setItem("cuckoo-nombre", st.name);
  localStorage.setItem("cuckoo-cara", st.face);
  localStorage.setItem("cuckoo-slug", st.slug);
  guardarSalaReciente(st.slug);
  st.screen = "room"; render();
  try {
    if (!backend) backend = await crearBackend();
    backend.unirseA(st.slug);
  } catch (e) {
    backend = null;
    mostrarAviso("No se pudo conectar con la sala. Revisa tu conexión.");
  }
  history.replaceState(null, "", `?sala=${encodeURIComponent(st.slug)}`);
}
function goLandingScreen() {
  clearInterval(breatheTimer);
  if (backend) backend.salir(st.slug);
  st.screen = "landing"; render();
}
function addMemberPrompt() { showToast("Comparte el enlace para invitar a alguien"); }
function changeMode() { st.mode = st.mode === "work" ? "break" : "work"; render(); }
function openDetailsInfo() { st.detailsOpen = true; render(); }
function closeDetails() { st.detailsOpen = false; render(); }
function openTweaks() { st.tweaksOpen = true; render(); }
function closeTweaks() { st.tweaksOpen = false; render(); }
function setPaleta(p) { st.tweakPaleta = p; localStorage.setItem("cuckoo-paleta", p); render(); }
function setEnergia(e) { st.tweakEnergia = e; localStorage.setItem("cuckoo-energia", e); render(); }
function setTimerStyle(s) { st.tweakTimerStyle = s; localStorage.setItem("cuckoo-estilotimer", s); render(); }
function toggleSound() { st.soundOn = !st.soundOn; localStorage.setItem("cuckoo-sound", st.soundOn ? "1" : "0"); render(); }
function setFocusMin(v) { st.focusMin = Math.max(1, Math.min(240, Number(v) || 50)); localStorage.setItem("cuckoo-focusMin", st.focusMin); render(); }
function setBreakMin(v) { st.breakMin = Math.max(1, Math.min(60, Number(v) || 10)); localStorage.setItem("cuckoo-breakMin", st.breakMin); render(); }

function startBreathe(min) {
  const modoInicio = st.mode;
  st.breatheCount = 3; render();
  clearInterval(breatheTimer);
  breatheTimer = setInterval(() => {
    st.breatheCount -= 1;
    if (st.breatheCount <= 0) {
      clearInterval(breatheTimer);
      st.breatheCount = null;
      if (backend) backend.iniciar(st.slug, modoInicio, min);
      else mostrarAviso("No hay conexión con la sala todavía. Intenta de nuevo.");
    }
    render();
  }, 1000);
}
function selectDurationClick(min) {
  st.flashMin = min; render();
  setTimeout(() => { st.flashMin = null; startBreathe(min); }, 260);
}
function openCustom() { st.customOpen = true; st.customValue = st.focusMin; render(); }
function confirmCustom() {
  const n = Math.max(1, Math.min(240, Number(st.customValue) || 50));
  st.customOpen = false;
  startBreathe(n);
}
function skipBreak() { st.mode = "work"; render(); }

function toggle() {
  if (!backend) { mostrarAviso("No hay conexión con la sala todavía."); return; }
  if (restanteSegundos() !== null && restanteSegundos() <= 0) {
    st.mode = modoEfectivo() === "work" ? "break" : "work";
    backend.detener(st.slug);
    return;
  }
  if (!st.timerFB && st.breatheCount === null) {
    const min = st.mode === "work" ? st.focusMin : st.breakMin;
    startBreathe(min);
    return;
  }
  if (st.breatheCount !== null) return;
  if (st.timerFB.pausado) backend.reanudar(st.slug);
  else backend.pausar(st.slug);
}
function resetTimer() {
  clearInterval(breatheTimer); st.breatheCount = null;
  if (backend) backend.detener(st.slug);
  render();
}

function addMeta() {
  const t = st.metaInput.trim();
  if (!t) return;
  if (backend) backend.agregarMeta(st.slug, t);
  st.metaInput = "";
  render();
}
function toggleMetaClick(id, hecho) { if (backend) backend.toggleMeta(st.slug, id, hecho); }
function removeMetaClick(id) { if (backend) backend.quitarMeta(st.slug, id); }

function computeStreak() {
  const mias = Object.values(st.historial[myId] || {});
  if (!mias.length) return 0;
  const dias = new Set(mias.map(h => h.fecha));
  const ordenados = [...dias].sort().reverse();
  let streak = 0, d = new Date(ordenados[0] + "T00:00:00");
  while (dias.has(d.toISOString().slice(0, 10))) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}
function choiceStyle(min, big, flashed, idx, pct) {
  const w = big ? 112 : 92;
  const h = big ? 132 : 108;
  let style = `display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;width:${w}px;height:${h}px;border-radius:24px;border:${big ? "2px" : "1px"} solid rgba(255,255,255,${big ? ".9" : ".32"});background:${big ? "rgba(255,255,255,.2)" : "rgba(255,255,255,.06)"};color:#fff;cursor:pointer;font-family:inherit;position:relative;box-shadow:${big ? "0 18px 36px rgba(15,20,60,.32)" : "0 8px 18px rgba(15,20,60,.16)"};opacity:0;animation:cardIn .5s cubic-bezier(.2,.8,.3,1) ${idx*0.08}s both${big ? ",floatCard 3.6s ease-in-out 1s infinite" : ""}`;
  if (flashed) style += ";transform:scale(1.08);background:rgba(255,255,255,.34);border-color:#fff;box-shadow:0 0 40px rgba(255,255,255,.7)";
  return style;
}
function choiceInner(min, big, pct) {
  return `${big ? `<span style="position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:.55rem;font-weight:800;letter-spacing:.08em;background:#fff;color:#5360d8;padding:3px 9px;border-radius:10px;white-space:nowrap">RECOMENDADO</span>` : ""}
<span style="font-size:${big?"2.3rem":"1.5rem"};font-weight:800;line-height:1">${min}</span>
<span style="font-size:.6rem;opacity:.75;letter-spacing:.1em;text-transform:uppercase">min</span>
<span style="width:${big?60:44}px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden"><span style="display:block;height:100%;width:${pct}%;background:#fff;border-radius:2px"></span></span>`;
}

/* ========= render ========= */
function render() {
  revisarFin();
  if (st.screen === "landing") return renderLanding();
  if (st.screen === "profile") return renderProfile();
  if (st.screen === "room") return renderRoom();
}

function renderLanding() {
  const BUBBLE_POS = [

  const pal = getPalette(), en = getEnergy();

  const ringPercent = hayTimer ? Math.round(((st.timerFB.duracionMs / 1000 - restante) / (st.timerFB.duracionMs / 1000)) * 100) : 0;
  const modeTitleText = modo === "work" ? "TIEMPO DE ENFOQUE" : "TIEMPO DE DESCANSO";

  const startLabel = terminado ? "SIGUIENTE" : (running ? "PAUSA" : "INICIAR");
  const finishText = modo === "work" ? "¡Sesión de enfoque terminada! 🎉" : "¡Descanso terminado! 🎉";
  const noticeText = terminado ? `¡Tu sesión de ${modo === "work" ? "enfoque" : "descanso"} terminó!` : "Te uniste a esta Cuckoo justo ahora";
  const breatheCaption = ({ 3: "Prepárate", 2: "Respira", 1: "Silencio" })[st.breatheCount] || "Silencio";

  // gente REAL de Firebase, filtrada a quien mandó señal de vida hace poco

  const ahora = Date.now();
  const conectadosEntries = Object.entries(st.gente).filter(([, p]) => ahora - (p.visto || 0) < PRESENCIA_MS);
  const allMembers = conectadosEntries.map(([, p]) => p);
  const hoy = hoyISO();
  const planos = [];
  for (const [pid, entradas] of Object.entries(st.historial)) for (const e of Object.values(entradas || {})) planos.push({ pid, ...e });
  const trabajoHoy = planos.filter(h => h.fecha === hoy && h.modo === "work");
  const blocksToday = trabajoHoy.length;
  const minutesToday = trabajoHoy.reduce((s, h) => s + h.minutos, 0);
  const streak = computeStreak();

    face: p.cara, name: p.nombre,

  })).sort((a, b) => b.minutes - a.minutes);

</div>` : ""}

</div>
<div style="display:flex;justify-content:center;gap:16px;margin-top:44px">
<button id="btn-toggle" class="btn-cta-primary" style="border:0;background:linear-gradient(120deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,.42) 50%,rgba(255,255,255,.2) 100%);background-size:220% 100%;animation:shimmerSweep 3.2s ease-in-out infinite;color:#fff;letter-spacing:.22em;font-size:.78rem;cursor:pointer;font-weight:700;padding:14px 28px;border-radius:30px">${startLabel}</button>
<button id="btn-reset" class="btn-cta-primary" style="border:0;background:transparent;color:rgba(255,255,255,.8);letter-spacing:.22em;font-size:.78rem;cursor:pointer;font-weight:700;padding:14px 28px">REINICIAR</button>
</div>

<div style="display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:60px;color:rgba(255,255,255,.6);font-size:.62rem;letter-spacing:.15em;text-transform:uppercase">
<span>Desliza para ver estadísticas</span>
<span style="font-size:1.1rem;animation:bounceHint ${en.bounce}s ease-in-out infinite">⌄</span>
</div>
</div>

<div style="display:flex;justify-content:center;padding:20px 24px 10px">
<div style="width:min(560px,100%);display:flex;flex-direction:column;align-items:center;gap:14px">
<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
${allMembers.map(m => `<span title="${esc(m.nombre)}" style="width:46px;height:46px;border-radius:50%;background:#fff;color:#25304a;display:grid;place-items:center;font-size:1.3rem;border:3px solid rgba(255,255,255,.3);box-shadow:0 3px 10px rgba(21,25,70,.15)">${esc(m.cara)}</span>`).join("")}
<button id="btn-invitar" style="width:46px;height:46px;border-radius:50%;background:transparent;color:rgba(255,255,255,.65);border:1px dashed rgba(255,255,255,.55);cursor:pointer;font-size:1.2rem">＋</button>
</div>
<div style="color:rgba(255,255,255,.75);font-size:.95rem">${allMembers.length} integrante(s) en esta Cuckoo.</div>
<div style="display:flex;gap:8px;align-items:center;font-size:.72rem;color:rgba(255,255,255,.72)">
<span style="width:26px;height:26px;border-radius:50%;background:#fff;color:#5061d8;display:grid;place-items:center;flex-shrink:0">🌎</span>
<span>${esc(noticeText)}</span>
</div>
</div>
</div>

<div style="display:flex;justify-content:center;padding:40px 24px 100px">
<div style="width:min(960px,100%);display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px;align-items:start">

<div style="background:rgba(255,255,255,.08);border-radius:20px;padding:26px;text-align:left">
<h3 style="margin:0 0 4px;font-family:'Manrope',sans-serif;font-size:1.15rem;font-weight:800">Metas de la sala</h3>
<p style="margin:0 0 18px;font-size:.78rem;color:rgba(255,255,255,.6)">Objetivos compartidos: cualquiera puede agregarlos y marcarlos.</p>
<div style="display:flex;gap:8px;margin-bottom:16px">
<input id="in-meta" placeholder="Agregar una meta..." value="${esc(st.metaInput)}" style="flex:1;padding:12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:8px;font-family:inherit;font-size:.88rem">
<button id="btn-agregar-meta" style="border:0;background:#fff;color:#5360d8;padding:0 16px;border-radius:8px;font-weight:800;cursor:pointer">＋</button>
</div>
<div style="display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto">
${metasList.length ? metasList.map(m => `
<div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);padding:10px 12px;border-radius:10px">
<button data-id="${m.id}" data-hecho="${m.hecho ? 1 : 0}" class="btn-meta-check" style="border:0;background:transparent;font-size:1.1rem;cursor:pointer;color:#fff;flex-shrink:0">${m.hecho ? "✅" : "○"}</button>
<span style="flex:1;font-size:.88rem;${m.hecho ? "text-decoration:line-through;opacity:.5" : ""}">${esc(m.texto)}</span>
<span title="${esc(m.autor || "")}" style="font-size:.95rem;flex-shrink:0">${esc(m.cara || "")}</span>
<button data-id="${m.id}" class="btn-meta-quitar" style="border:0;background:transparent;color:rgba(255,255,255,.5);cursor:pointer;font-size:1.05rem;flex-shrink:0">×</button>
</div>`).join("") : `<p style="color:rgba(255,255,255,.45);font-style:italic;margin:4px 0;font-size:.85rem">Aún no hay metas. Agrega la primera.</p>`}
</div>
${metasList.length ? `<div style="margin-top:14px;font-size:.75rem;color:rgba(255,255,255,.6)">${metasHechas} de ${metasList.length} completadas</div>` : ""}
</div>

<div style="background:rgba(255,255,255,.08);border-radius:20px;padding:26px;text-align:left">
<h3 style="margin:0 0 18px;font-family:'Manrope',sans-serif;font-size:1.15rem;font-weight:800">Estadísticas de la sala</h3>
<div style="display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap">
<div style="flex:1;min-width:110px;background:rgba(255,255,255,.1);border-radius:14px;padding:16px;text-align:center">
<div style="font-size:1.6rem;font-weight:800">${blocksToday}</div>
<div style="font-size:.66rem;color:rgba(255,255,255,.65);margin-top:4px;letter-spacing:.05em;text-transform:uppercase">bloques hoy</div>
</div>
<div style="flex:1;min-width:110px;background:rgba(255,255,255,.1);border-radius:14px;padding:16px;text-align:center">
<div style="font-size:1.6rem;font-weight:800">${minutesToday}</div>
<div style="font-size:.66rem;color:rgba(255,255,255,.65);margin-top:4px;letter-spacing:.05em;text-transform:uppercase">min hoy</div>
</div>
<div style="flex:1;min-width:110px;background:rgba(255,255,255,.1);border-radius:14px;padding:16px;text-align:center">
<div style="font-size:1.6rem;font-weight:800">${promedioGrupo}</div>
<div style="font-size:.66rem;color:rgba(255,255,255,.65);margin-top:4px;letter-spacing:.05em;text-transform:uppercase">prom./persona</div>
</div>
<div style="flex:1;min-width:110px;background:rgba(255,255,255,.1);border-radius:14px;padding:16px;text-align:center">
<div style="font-size:1.6rem;font-weight:800">🔥${streak}</div>
<div style="font-size:.66rem;color:rgba(255,255,255,.65);margin-top:4px;letter-spacing:.05em;text-transform:uppercase">tu racha</div>
</div>
</div>
<div style="font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:10px">Por integrante hoy</div>
<div style="display:flex;flex-direction:column;gap:10px">
${memberStats.length ? memberStats.map((ms, idx) => `
<div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 14px">
<span style="width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1rem;flex-shrink:0">${esc(ms.face)}</span>
<div style="flex:1;min-width:0">
<div style="display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:5px;gap:8px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${idx === 0 && ms.minutes > 0 ? "🏆 " : ""}${esc(ms.name)}</span><span style="color:rgba(255,255,255,.7);flex-shrink:0">${ms.minutes} min</span></div>
<div style="height:5px;background:rgba(255,255,255,.15);border-radius:3px"><div style="height:100%;width:${Math.round(ms.minutes / maxMin * 100)}%;background:#fff;border-radius:3px"></div></div>
</div>
</div>`).join("") : `<div style="color:rgba(255,255,255,.5);font-size:.85rem">Nadie ha completado un bloque todavía.</div>`}
</div>
</div>

</div>
</div>

${st.detailsOpen ? `
<div style="position:fixed;inset:0;background:rgba(25,25,93,.97);z-index:20;padding:40px 26px;overflow:auto;text-align:left;animation:fadeUp .3s ease">
<div style="width:min(480px,100%);margin:0 auto">
<button id="btn-cerrar-ajustes" style="float:right;border:0;background:transparent;color:#fff;font-size:1.6rem;cursor:pointer">×</button>
<h2 style="margin:6px 0 24px;clear:both;font-family:'Manrope',sans-serif;font-size:1.3rem">Ajustes</h2>
<label style="display:block;font-size:.7rem;margin-top:8px">Estudio predeterminado (min)
<input id="in-focus" type="number" min="1" max="240" value="${st.focusMin}" style="width:100%;padding:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.34);color:#fff;margin-top:5px;border-radius:8px;font-family:inherit">
</label>
<label style="display:block;font-size:.7rem;margin-top:14px">Descanso predeterminado (min)
<input id="in-break" type="number" min="1" max="60" value="${st.breakMin}" style="width:100%;padding:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.34);color:#fff;margin-top:5px;border-radius:8px;font-family:inherit">
</label>
<button id="btn-sonido" style="width:100%;margin-top:10px;border:1px solid rgba(255,255,255,.34);background:transparent;color:#fff;padding:13px;border-radius:8px;font-weight:700;cursor:pointer">${st.soundOn ? "🔔 Sonido y notificaciones activadas" : "🔕 Sonido y notificaciones desactivadas"}</button>
</div>
</div>` : ""}

${st.tweaksOpen ? `
<div style="position:fixed;inset:0;background:rgba(25,25,93,.97);z-index:20;padding:40px 26px;overflow:auto;text-align:left;animation:fadeUp .3s ease">
<div style="width:min(480px,100%);margin:0 auto">
<button id="btn-cerrar-tweaks" style="float:right;border:0;background:transparent;color:#fff;font-size:1.6rem;cursor:pointer">×</button>
<h2 style="margin:6px 0 6px;clear:both;font-family:'Manrope',sans-serif;font-size:1.3rem">Apariencia</h2>
<p style="margin:0 0 24px;font-size:.8rem;color:rgba(255,255,255,.6)">Cambia el ánimo visual de la sala para todos.</p>

<div style="font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:10px">Paleta</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px">
${Object.entries(PALETTES).map(([key, p]) => `<button data-paleta="${key}" class="btn-paleta" style="padding:10px 16px;border-radius:20px;border:2px solid ${st.tweakPaleta===key?"#fff":"rgba(255,255,255,.25)"};cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:700;color:#fff;background:${p.bg}">${p.label}</button>`).join("")}
</div>

<div style="font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:10px">Energía visual</div>
<div style="display:flex;gap:10px;margin-bottom:26px">
${[["calma","Calma"],["normal","Normal"],["viva","Viva"]].map(([key,label]) => `<button data-energia="${key}" class="btn-energia" style="flex:1;padding:10px;border-radius:10px;border:0;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:700;background:${st.tweakEnergia===key?"#fff":"rgba(255,255,255,.12)"};color:${st.tweakEnergia===key?"#5360d8":"#fff"}">${label}</button>`).join("")}
</div>

<div style="font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:10px">Estilo del temporizador</div>
<div style="display:flex;gap:10px">
${[["anillo","Anillo"],["minimal","Minimalista"]].map(([key,label]) => `<button data-timerstyle="${key}" class="btn-timerstyle" style="flex:1;padding:10px;border-radius:10px;border:0;cursor:pointer;font-family:inherit;font-size:.82rem;font-weight:700;background:${st.tweakTimerStyle===key?"#fff":"rgba(255,255,255,.12)"};color:${st.tweakTimerStyle===key?"#5360d8":"#fff"}">${label}</button>`).join("")}
</div>

</div>
</div>` : ""}
</div>
</div>`;

  document.querySelectorAll(".btn-dur").forEach(b => b.addEventListener("click", () => selectDurationClick(Number(b.dataset.min))));
  const bca = document.getElementById("btn-custom-abrir"); if (bca) bca.addEventListener("click", openCustom);
  const bco = document.getElementById("btn-custom-ok"); if (bco) bco.addEventListener("click", () => { st.customValue = document.getElementById("in-custom").value; confirmCustom(); });
  const bsd = document.getElementById("btn-saltar-descanso"); if (bsd) bsd.addEventListener("click", skipBreak);
  document.getElementById("btn-toggle").addEventListener("click", toggle);
  document.getElementById("btn-reset").addEventListener("click", resetTimer);
  document.getElementById("btn-modo").addEventListener("click", changeMode);
  document.getElementById("btn-ajustes").addEventListener("click", openDetailsInfo);
  document.getElementById("btn-salir").addEventListener("click", goLandingScreen);
  document.getElementById("btn-invitar").addEventListener("click", addMemberPrompt);
  const bce = document.getElementById("btn-cerrar-ajustes"); if (bce) bce.addEventListener("click", closeDetails);
  const inFocus = document.getElementById("in-focus"); if (inFocus) inFocus.addEventListener("change", e => setFocusMin(e.target.value));
  const inBreak = document.getElementById("in-break"); if (inBreak) inBreak.addEventListener("change", e => setBreakMin(e.target.value));
  const bsonido = document.getElementById("btn-sonido"); if (bsonido) bsonido.addEventListener("click", toggleSound);
  const inMeta = document.getElementById("in-meta");
  if (inMeta) { inMeta.addEventListener("input", e => st.metaInput = e.target.value); inMeta.addEventListener("keydown", e => { if (e.key === "Enter") addMeta(); }); }
  const bam = document.getElementById("btn-agregar-meta"); if (bam) bam.addEventListener("click", addMeta);
  document.querySelectorAll(".btn-meta-check").forEach(b => b.addEventListener("click", () => toggleMetaClick(b.dataset.id, b.dataset.hecho === "1")));
  document.querySelectorAll(".btn-meta-quitar").forEach(b => b.addEventListener("click", () => removeMetaClick(b.dataset.id)));
  const btw = document.getElementById("btn-tweaks"); if (btw) btw.addEventListener("click", openTweaks);
  const bct = document.getElementById("btn-cerrar-tweaks"); if (bct) bct.addEventListener("click", closeTweaks);
  document.querySelectorAll(".btn-paleta").forEach(b => b.addEventListener("click", () => setPaleta(b.dataset.paleta)));
  document.querySelectorAll(".btn-energia").forEach(b => b.addEventListener("click", () => setEnergia(b.dataset.energia)));
  document.querySelectorAll(".btn-timerstyle").forEach(b => b.addEventListener("click", () => setTimerStyle(b.dataset.timerstyle)));
}

/* ========= "tick" ligero: solo toca los números y el anillo, nunca reconstruye la pantalla ========= */
function tick() {
  if (st.screen !== "room" || st.breatheCount !== null) return;
  const t = st.timerFB;
  if (!t || t.pausado) return;
  const restante = restanteSegundos();
  if (restante <= 0) { render(); return; } // el bloque terminó: aquí sí hace falta reconstruir (confeti, crédito)
  const digits = document.getElementById("digits");
  if (digits) digits.textContent = fmt(restante);
  const total = t.duracionMs / 1000;
  const pct = Math.round(((total - restante) / total) * 100);
  const anillo = document.getElementById("anillo");
  if (anillo) anillo.style.background = `conic-gradient(#fff calc(${pct}*1%),rgba(255,255,255,.22) 0)`;
  const barra = document.getElementById("barra-minimal");
  if (barra) barra.style.width = pct + "%";
}

/* ========= arranque ========= */
// Reconexión directa: si ya tienes nombre y sala guardados, entras de inmediato a tu última sala
if (st.screen === "room" && st.name) {
  enterRoom();
} else {
  if (st.screen === "room") st.screen = "profile";
  render();
}
clearInterval(renderInterval);
renderInterval = setInterval(tick, 250);

// señal de vida cada 20s (solo si la ventana está a la vista) — así, quien deja
// la app abierta en segundo plano sin verla deja de contar como "conectado"
clearInterval(latidoInterval);
latidoInterval = setInterval(() => { if (backend && st.screen === "room") backend.latido(st.slug); }, 20000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && backend && st.screen === "room") backend.latido(st.slug);
});

// refresco lento para que los perfiles vencidos desaparezcan aunque nadie más cambie nada
clearInterval(presenciaInterval);
presenciaInterval = setInterval(() => { if (st.screen === "room") render(); }, 15000);
</script>
</body>
</html>
